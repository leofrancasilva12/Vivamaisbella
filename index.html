<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petrolinked — Visualizador de Equipamento</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --red: #D32F2F;
    --blue: #1565C0;
    --cyan: #00BCD4;
    --steel: #B0BEC5;
    --bg: #0A0C10;
    --surface: #111318;
    --border: rgba(255,255,255,0.06);
    --text: #E8EAF0;
    --muted: #6B7280;
    --gold: #F59E0B;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    overflow: hidden;
    user-select: none;
  }

  /* GRID BG */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(21,101,192,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(21,101,192,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* HEADER */
  header {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 16px 28px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(10,12,16,0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
  }

  .logo {
    display: flex; align-items: center; gap: 10px;
  }
  .logo-text {
    font-family: 'Syne', sans-serif;
    font-size: 20px; font-weight: 800;
    letter-spacing: -0.5px;
  }
  .logo-text span { color: var(--cyan); }

  .badge {
    background: rgba(0,188,212,0.1);
    border: 1px solid rgba(0,188,212,0.25);
    color: var(--cyan);
    font-size: 10px; font-weight: 500;
    padding: 3px 10px; border-radius: 20px;
    letter-spacing: 1px; text-transform: uppercase;
  }

  .controls-hint {
    font-size: 11px; color: var(--muted);
    display: flex; gap: 20px; align-items: center;
  }
  .hint-item { display: flex; align-items: center; gap: 6px; }
  .hint-icon {
    width: 22px; height: 22px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: var(--steel);
    background: rgba(255,255,255,0.03);
  }

  /* SCENE */
  #scene {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
    perspective: 1200px;
    cursor: grab;
  }
  #scene:active { cursor: grabbing; }

  #stage {
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.05s linear;
  }

  #equipment-img {
    display: block;
    width: 560px;
    max-width: 90vw;
    filter: drop-shadow(0 40px 80px rgba(0,0,0,0.8)) drop-shadow(0 0 40px rgba(21,101,192,0.15));
    transition: filter 0.3s ease;
    pointer-events: none;
  }

  /* HOTSPOTS */
  .hotspot {
    position: absolute;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: rgba(10,12,16,0.75);
    border: 2px solid var(--cyan);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Syne', sans-serif;
    font-size: 10px; font-weight: 700;
    color: var(--cyan);
    transform: translate(-50%, -50%);
    transition: all 0.2s ease;
    z-index: 10;
    box-shadow: 0 0 0 0 rgba(0,188,212,0.4);
  }

  .hotspot::before {
    content: '';
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 50%;
    background: rgba(0,188,212,0.15);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.8); opacity: 0; }
  }

  .hotspot:hover {
    background: var(--cyan);
    color: var(--bg);
    transform: translate(-50%, -50%) scale(1.2);
    box-shadow: 0 0 20px rgba(0,188,212,0.6);
    z-index: 20;
  }

  .hotspot.active {
    background: var(--cyan);
    color: var(--bg);
    box-shadow: 0 0 24px rgba(0,188,212,0.8);
  }

  /* TOOLTIP */
  .tooltip {
    position: absolute;
    background: rgba(10,12,16,0.95);
    border: 1px solid rgba(0,188,212,0.3);
    border-radius: 10px;
    padding: 12px 16px;
    min-width: 200px;
    max-width: 240px;
    pointer-events: none;
    opacity: 0;
    transform: translateY(6px);
    transition: all 0.2s ease;
    z-index: 50;
    backdrop-filter: blur(10px);
  }

  .tooltip.show {
    opacity: 1;
    transform: translateY(0);
  }

  .tooltip-num {
    font-size: 9px; color: var(--cyan);
    letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 4px;
  }

  .tooltip-name {
    font-family: 'Syne', sans-serif;
    font-size: 14px; font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
    line-height: 1.3;
  }

  .tooltip-desc {
    font-size: 10px; color: var(--muted);
    line-height: 1.6;
  }

  .tooltip-tag {
    display: inline-block;
    margin-top: 8px;
    font-size: 9px;
    padding: 2px 8px; border-radius: 4px;
    letter-spacing: 1px; text-transform: uppercase;
    font-weight: 500;
  }

  .tag-red { background: rgba(211,47,47,0.2); color: #EF9A9A; border: 1px solid rgba(211,47,47,0.3); }
  .tag-blue { background: rgba(21,101,192,0.2); color: #90CAF9; border: 1px solid rgba(21,101,192,0.3); }
  .tag-steel { background: rgba(176,190,197,0.1); color: var(--steel); border: 1px solid rgba(176,190,197,0.2); }

  /* SIDE PANEL */
  #panel {
    position: fixed;
    right: 0; top: 0; bottom: 0;
    width: 280px;
    background: rgba(10,12,16,0.92);
    border-left: 1px solid var(--border);
    backdrop-filter: blur(20px);
    z-index: 50;
    display: flex; flex-direction: column;
    padding-top: 72px;
    transform: translateX(100%);
    transition: transform 0.4s cubic-bezier(0.16,1,0.3,1);
  }

  #panel.open { transform: translateX(0); }

  #panel-toggle {
    position: fixed;
    right: 20px;
    bottom: 32px;
    z-index: 60;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 12px 20px;
    font-family: 'Syne', sans-serif;
    font-size: 12px; font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    box-shadow: 0 8px 24px rgba(211,47,47,0.4);
    transition: all 0.2s;
  }
  #panel-toggle:hover { background: #B71C1C; transform: translateY(-2px); }

  .panel-title {
    font-family: 'Syne', sans-serif;
    font-size: 11px; font-weight: 700;
    color: var(--muted);
    letter-spacing: 2px; text-transform: uppercase;
    padding: 0 20px 12px;
    border-bottom: 1px solid var(--border);
  }

  .parts-list {
    overflow-y: auto;
    flex: 1;
    padding: 8px 0;
  }

  .part-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 20px;
    cursor: pointer;
    transition: background 0.15s;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .part-item:hover { background: rgba(0,188,212,0.05); }
  .part-item.active { background: rgba(0,188,212,0.08); }

  .part-num {
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(0,188,212,0.1);
    border: 1px solid rgba(0,188,212,0.3);
    font-family: 'Syne', sans-serif;
    font-size: 10px; font-weight: 700;
    color: var(--cyan);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }

  .part-info { flex: 1; }
  .part-name {
    font-family: 'Syne', sans-serif;
    font-size: 12px; font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }
  .part-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }

  .part-dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  .dot-red { background: var(--red); }
  .dot-blue { background: var(--blue); }
  .dot-steel { background: var(--steel); }

  /* ZOOM CONTROLS */
  #zoom-controls {
    position: fixed;
    left: 24px; bottom: 32px;
    z-index: 60;
    display: flex; flex-direction: column; gap: 4px;
  }

  .zoom-btn {
    width: 40px; height: 40px;
    background: rgba(17,19,24,0.9);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    backdrop-filter: blur(10px);
  }
  .zoom-btn:hover { border-color: var(--cyan); color: var(--cyan); background: rgba(0,188,212,0.08); }

  /* RESET BTN */
  #reset-btn {
    width: 40px; height: 40px;
    background: rgba(17,19,24,0.9);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    backdrop-filter: blur(10px);
    margin-top: 4px;
  }
  #reset-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* ROTATION INDICATOR */
  #rot-indicator {
    position: fixed;
    left: 24px; bottom: 160px;
    z-index: 60;
    width: 56px; height: 56px;
  }

  #rot-indicator svg { width: 100%; height: 100%; }

  /* INTRO OVERLAY */
  #intro {
    position: fixed; inset: 0; z-index: 200;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 16px;
    animation: fadeOut 0.6s ease 2s forwards;
    pointer-events: none;
  }

  @keyframes fadeOut {
    to { opacity: 0; visibility: hidden; }
  }

  .intro-logo {
    font-family: 'Syne', sans-serif;
    font-size: 32px; font-weight: 800;
    letter-spacing: -1px;
    animation: slideUp 0.6s ease both;
  }
  .intro-logo span { color: var(--cyan); }

  .intro-sub {
    font-size: 11px; color: var(--muted);
    letter-spacing: 3px; text-transform: uppercase;
    animation: slideUp 0.6s ease 0.2s both;
  }

  .intro-bar {
    width: 120px; height: 2px;
    background: rgba(255,255,255,0.05);
    border-radius: 2px;
    overflow: hidden;
    animation: slideUp 0.6s ease 0.3s both;
  }

  .intro-bar-fill {
    height: 100%;
    background: var(--cyan);
    animation: fillBar 1.5s ease 0.4s both;
  }

  @keyframes fillBar { from { width: 0; } to { width: 100%; } }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* SCROLLBAR */
  .parts-list::-webkit-scrollbar { width: 4px; }
  .parts-list::-webkit-scrollbar-track { background: transparent; }
  .parts-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }

  @media (max-width: 600px) {
    #panel { width: 100%; }
    #equipment-img { width: 95vw; }
    .controls-hint { display: none; }
  }
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
  <div class="intro-logo">Petro<span>linked</span></div>
  <div class="intro-sub">Visualizador de Equipamento</div>
  <div class="intro-bar"><div class="intro-bar-fill"></div></div>
</div>

<!-- HEADER -->
<header>
  <div class="logo">
    <div class="logo-text">Petro<span>linked</span></div>
    <div class="badge">3D Viewer</div>
  </div>
  <div class="controls-hint">
    <div class="hint-item">
      <div class="hint-icon">↔</div>
      Arrastar para girar
    </div>
    <div class="hint-item">
      <div class="hint-icon">⊕</div>
      Scroll para zoom
    </div>
    <div class="hint-item">
      <div class="hint-icon">●</div>
      Clicar nas peças
    </div>
  </div>
</header>

<!-- SCENE -->
<div id="scene">
  <div id="stage">
    <img id="equipment-img" src="1000595902.jpg" alt="Equipamento Petrolinked" draggable="false">

    <!-- HOTSPOTS — nova perspectiva (árvore de natal à esquerda, manifold à direita) -->
    <!-- 1 - Cabeça do Poço -->
    <div class="hotspot" id="hs-1" style="left:33%;top:80%;" data-id="1">1</div>
    <!-- 2 - Árvore de Natal -->
    <div class="hotspot" id="hs-2" style="left:30%;top:48%;" data-id="2">2</div>
    <!-- 3 - Válvula Gaveta (volante vermelho) -->
    <div class="hotspot" id="hs-3" style="left:22%;top:47%;" data-id="3">3</div>
    <!-- 4 - Válvula de Esfera inferior -->
    <div class="hotspot" id="hs-4" style="left:52%;top:76%;" data-id="4">4</div>
    <!-- 5 - Junção em T direita -->
    <div class="hotspot" id="hs-5" style="left:78%;top:52%;" data-id="5">5</div>
    <!-- 6 - Conector Union superior direito -->
    <div class="hotspot" id="hs-6" style="left:65%;top:46%;" data-id="6">6</div>
    <!-- 7 - Cotovelo 90° inferior direito -->
    <div class="hotspot" id="hs-7" style="left:79%;top:65%;" data-id="7">7</div>
    <!-- 8 - Válvula de Controle topo -->
    <div class="hotspot" id="hs-8" style="left:29%;top:10%;" data-id="8">8</div>
    <!-- 9 - Flange de Base -->
    <div class="hotspot" id="hs-9" style="left:31%;top:90%;" data-id="9">9</div>
    <!-- 10 - Tubulação cromada -->
    <div class="hotspot" id="hs-10" style="left:55%;top:58%;" data-id="10">10</div>
  </div>
</div>

<!-- TOOLTIP -->
<div class="tooltip" id="tooltip">
  <div class="tooltip-num" id="tt-num">01</div>
  <div class="tooltip-name" id="tt-name">Nome da Peça</div>
  <div class="tooltip-desc" id="tt-desc">Descrição técnica</div>
  <div class="tooltip-tag" id="tt-tag">Categoria</div>
</div>

<!-- ZOOM CONTROLS -->
<div id="zoom-controls">
  <button class="zoom-btn" id="zoom-in">+</button>
  <button class="zoom-btn" id="zoom-out">−</button>
  <button id="reset-btn" title="Resetar">↺</button>
</div>

<!-- ROTATION INDICATOR -->
<div id="rot-indicator">
  <svg viewBox="0 0 56 56" fill="none">
    <circle cx="28" cy="28" r="24" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="24" stroke="rgba(0,188,212,0.3)" stroke-width="1.5"
      stroke-dasharray="30 120" stroke-linecap="round" id="rot-arc"/>
    <circle cx="28" cy="4" r="3" fill="var(--cyan)" id="rot-dot"/>
    <text x="28" y="32" text-anchor="middle" fill="rgba(255,255,255,0.3)"
      font-family="DM Mono" font-size="8">ROT</text>
  </svg>
</div>

<!-- PANEL TOGGLE -->
<button id="panel-toggle" onclick="togglePanel()">
  <span id="panel-icon">☰</span> Peças
</button>

<!-- SIDE PANEL -->
<div id="panel">
  <div class="panel-title">Lista de Componentes</div>
  <div class="parts-list" id="parts-list"></div>
</div>

<script>
const PARTS = [
  { id: 1, name: "Cabeça do Poço", en: "Wellhead", desc: "Componente de superfície que sela o poço e suporta o peso do revestimento e tubulação de produção.", tag: "Estrutural", color: "red" },
  { id: 2, name: "Árvore de Natal", en: "Christmas Tree", desc: "Conjunto de válvulas e conexões que controla o fluxo do fluido do poço para a linha de produção.", tag: "Controle", color: "red" },
  { id: 3, name: "Válvula Gaveta", en: "Gate Valve", desc: "Válvula de isolamento com obturador em cunha. Utilizada para abertura e fechamento total do fluxo.", tag: "Válvula", color: "red" },
  { id: 4, name: "Válvula de Esfera", en: "Ball Valve", desc: "Válvula com obturador esférico perfurado. Alta vedação e acionamento rápido de 90°.", tag: "Válvula", color: "red" },
  { id: 5, name: "Junção em T", en: "Tee Junction", desc: "Conexão tripla que distribui o fluxo em três direções. Usada em manifolds e linhas de produção.", tag: "Conexão", color: "blue" },
  { id: 6, name: "Conector Union", en: "Union Connector", desc: "Conexão desmontável de três peças que permite fácil remoção de componentes sem cortar tubulação.", tag: "Conexão", color: "blue" },
  { id: 7, name: "Cotovelo 90°", en: "Elbow 90°", desc: "Curva de mudança de direção em 90°. Redireciona o fluxo de fluido entre tubulações perpendiculares.", tag: "Conexão", color: "blue" },
  { id: 8, name: "Válvula de Controle", en: "Control Valve", desc: "Válvula de regulação no topo da árvore para controle de pressão e vazão da produção.", tag: "Controle", color: "steel" },
  { id: 9, name: "Flange de Base", en: "Base Flange", desc: "Flange principal de conexão entre a cabeça do poço e a árvore de natal. Suporta cargas axiais elevadas.", tag: "Estrutural", color: "red" },
  { id: 10, name: "Tubulação", en: "Tubing / Piping", desc: "Dutos cromados em aço inox ou carbono para condução de fluidos entre os componentes do sistema.", tag: "Tubulação", color: "steel" },
];

// BUILD PARTS LIST
const list = document.getElementById('parts-list');
PARTS.forEach(p => {
  const el = document.createElement('div');
  el.className = 'part-item';
  el.id = `pi-${p.id}`;
  el.innerHTML = `
    <div class="part-num">${p.id}</div>
    <div class="part-info">
      <div class="part-name">${p.name}</div>
      <div class="part-sub">${p.en}</div>
    </div>
    <div class="part-dot dot-${p.color}"></div>
  `;
  el.addEventListener('click', () => focusPart(p.id));
  list.appendChild(el);
});

// TOOLTIP LOGIC
const tooltip = document.getElementById('tooltip');
let activeId = null;

function showTooltip(id, hsEl) {
  const p = PARTS.find(x => x.id === id);
  if (!p) return;

  document.getElementById('tt-num').textContent = `Componente ${String(id).padStart(2,'0')}`;
  document.getElementById('tt-name').textContent = p.name;
  document.getElementById('tt-desc').textContent = p.desc;
  const tag = document.getElementById('tt-tag');
  tag.textContent = p.tag;
  tag.className = `tooltip-tag tag-${p.color}`;

  // Position tooltip
  const rect = hsEl.getBoundingClientRect();
  const sceneRect = document.getElementById('scene').getBoundingClientRect();
  let left = rect.left - sceneRect.left + rect.width/2 + 12;
  let top = rect.top - sceneRect.top - 40;

  // Flip if overflows right
  if (left + 240 > window.innerWidth - 20) left = rect.left - sceneRect.left - 224;
  if (top < 80) top = rect.top - sceneRect.top + rect.height + 8;

  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
  tooltip.classList.add('show');

  // Mark active
  document.querySelectorAll('.hotspot').forEach(h => h.classList.remove('active'));
  document.querySelectorAll('.part-item').forEach(h => h.classList.remove('active'));
  hsEl.classList.add('active');
  const pi = document.getElementById(`pi-${id}`);
  if (pi) { pi.classList.add('active'); pi.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }

  activeId = id;
}

function hideTooltip() {
  tooltip.classList.remove('show');
  document.querySelectorAll('.hotspot').forEach(h => h.classList.remove('active'));
  document.querySelectorAll('.part-item').forEach(h => h.classList.remove('active'));
  activeId = null;
}

document.querySelectorAll('.hotspot').forEach(hs => {
  hs.addEventListener('click', (e) => {
    e.stopPropagation();
    const id = parseInt(hs.dataset.id);
    if (activeId === id) { hideTooltip(); return; }
    showTooltip(id, hs);
  });
});

document.getElementById('scene').addEventListener('click', () => hideTooltip());

function focusPart(id) {
  const hs = document.getElementById(`hs-${id}`);
  if (hs) showTooltip(id, hs);
}

// 3D ROTATION
const stage = document.getElementById('stage');
let rotX = -10, rotY = 15;
let targetX = -10, targetY = 15;
let isDragging = false;
let lastX = 0, lastY = 0;
let scale = 1, targetScale = 1;
const MIN_SCALE = 0.5, MAX_SCALE = 3;

function updateTransform() {
  stage.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) scale(${scale})`;
  // Update rotation indicator
  const angle = rotY * Math.PI / 180;
  const cx = 28, cy = 28, r = 24;
  const dx = Math.sin(angle) * r;
  const dy = -Math.cos(angle) * r;
  document.getElementById('rot-dot').setAttribute('cx', cx + dx);
  document.getElementById('rot-dot').setAttribute('cy', cy + dy);
  document.getElementById('rot-arc').setAttribute('transform', `rotate(${rotY}, 28, 28)`);
}

// Mouse drag
document.getElementById('scene').addEventListener('mousedown', e => {
  if (e.target.classList.contains('hotspot')) return;
  isDragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  hideTooltip();
});

window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  targetY += dx * 0.4;
  targetX -= dy * 0.3;
  targetX = Math.max(-35, Math.min(35, targetX));
  lastX = e.clientX;
  lastY = e.clientY;
});

window.addEventListener('mouseup', () => { isDragging = false; });

// Touch drag
let lastTX = 0, lastTY = 0;
let initDist = null;

document.getElementById('scene').addEventListener('touchstart', e => {
  if (e.target.classList.contains('hotspot')) return;
  if (e.touches.length === 1) {
    lastTX = e.touches[0].clientX;
    lastTY = e.touches[0].clientY;
    isDragging = true;
    hideTooltip();
  } else if (e.touches.length === 2) {
    initDist = Math.hypot(
      e.touches[1].clientX - e.touches[0].clientX,
      e.touches[1].clientY - e.touches[0].clientY
    );
  }
}, { passive: true });

document.getElementById('scene').addEventListener('touchmove', e => {
  if (e.touches.length === 1 && isDragging) {
    const dx = e.touches[0].clientX - lastTX;
    const dy = e.touches[0].clientY - lastTY;
    targetY += dx * 0.5;
    targetX -= dy * 0.3;
    targetX = Math.max(-35, Math.min(35, targetX));
    lastTX = e.touches[0].clientX;
    lastTY = e.touches[0].clientY;
  } else if (e.touches.length === 2 && initDist) {
    const dist = Math.hypot(
      e.touches[1].clientX - e.touches[0].clientX,
      e.touches[1].clientY - e.touches[0].clientY
    );
    targetScale *= dist / initDist;
    targetScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, targetScale));
    initDist = dist;
  }
}, { passive: true });

document.getElementById('scene').addEventListener('touchend', () => {
  isDragging = false;
  initDist = null;
}, { passive: true });

// Scroll zoom
document.getElementById('scene').addEventListener('wheel', e => {
  e.preventDefault();
  targetScale -= e.deltaY * 0.001;
  targetScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, targetScale));
}, { passive: false });

// Zoom buttons
document.getElementById('zoom-in').addEventListener('click', () => {
  targetScale = Math.min(MAX_SCALE, targetScale + 0.2);
});
document.getElementById('zoom-out').addEventListener('click', () => {
  targetScale = Math.max(MIN_SCALE, targetScale - 0.2);
});
document.getElementById('reset-btn').addEventListener('click', () => {
  targetX = -10; targetY = 15; targetScale = 1;
  hideTooltip();
});

// Animation loop
function animate() {
  rotX += (targetX - rotX) * 0.1;
  rotY += (targetY - rotY) * 0.1;
  scale += (targetScale - scale) * 0.1;
  updateTransform();
  requestAnimationFrame(animate);
}
animate();

// Auto-rotate on load
let autoRotate = true;
setTimeout(() => {
  const autoInterval = setInterval(() => {
    if (autoRotate && !isDragging) {
      targetY += 0.3;
    } else {
      clearInterval(autoInterval);
    }
  }, 16);
  document.getElementById('scene').addEventListener('mousedown', () => { autoRotate = false; }, { once: true });
  document.getElementById('scene').addEventListener('touchstart', () => { autoRotate = false; }, { once: true });
  setTimeout(() => { autoRotate = false; }, 4000);
}, 2200);

// PANEL
let panelOpen = false;
function togglePanel() {
  panelOpen = !panelOpen;
  document.getElementById('panel').classList.toggle('open', panelOpen);
  document.getElementById('panel-icon').textContent = panelOpen ? '✕' : '☰';
}
</script>
</body>
